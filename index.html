<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>golf-course-finder</title>
  </head>
  <body>
    <header>
      <div class="container">
        <h1>Golf Course Finder</h1>
        <p>Search for golf courses and explore basic course information.</p>
      </div>
    </header>
    <main>
      <section class="search-section">
        <div class="container">
          <h2>Find a course</h2>
          <form id="course-search-form">
            <label for="course-search">Course name or location</label>
            <div class="search-controls">
              <input 
              type="search"
              id="course-search"
              name="query"
              placeholder="For example, Drøbak or Oslo"
              required
              >
              <button type="submit">Search</button>
              <label for="country-preference">Country</label>
              <select name="country-preference" id="country-preference" >
                <option value="all">All</option>
                <option value="norway">Norway</option>
                <option value="sweden">Sweden</option>
              </select>
              <fieldset>   
                <legend>Holes</legend>             
                <label><input type="radio" name="hole-preference" value="all" checked> All</label>
                <label><input type="radio" name="hole-preference" value="18"> 18 holes</label>
                <label><input type="radio" name="hole-preference" value="9"> 9 holes</label>
              </fieldset>
            </div>
          </form>
        </div>
      </section>
      <section class="results-section" aria-labelledby="results-heading">
        <div class="container">
          <h2 id="results-heading">Results</h2>
          <div id="search-status" aria-live="polite"></div>
          <ul id="course-results"></ul>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
